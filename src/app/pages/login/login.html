 <div class="login-card">
    <h3 class="text-center mb-4">Login</h3>
    <form [formGroup]="loginform">
      <!-- Username -->
      <div class="mb-3">
        <label for="username" class="form-label">Username</label>
        <input type="text" class="form-control" id="username" placeholder="Enter username" required formControlName="userName">
      </div>

      <!-- Password -->
      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input type="password" class="form-control" id="password" placeholder="Enter password" required formControlName="password">
      </div>

      <!-- Submit Button -->
      <div class="d-grid">
        <button type="submit" class="btn btn-primary" (click)="onLogin()">Login</button>
      </div>
    </form>
  </div>
